services:
  # Backend FastAPI Web Service
  - type: web
    name: high-learner-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: ENVIRONMENT
        value: production
